version: "3.9"

services:
  api:
    build: .
    image: workshops-ai:local
    container_name: workshops-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Safe defaults if .env not set
      DATA_ROOT: /app/data
      ENABLE_DOCS: "true"         # dev only; vypněte v prod
      WORKSHOPS_AI_CORS_ORIGINS: "http://localhost:3000"
      WORKSHOPS_AI_TAZILA__MODE: "file"        # v prod zvažte "http"
      WORKSHOPS_AI_REDIS__URL: "redis://redis:6379/0"
      WORKSHOPS_AI_RATELIMIT__ENABLED: "true"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(\"http://127.0.0.1:8000/readyz\").getcode()==200 else sys.exit(1)'"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: workshops-ai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
